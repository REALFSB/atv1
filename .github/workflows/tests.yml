# Integração contínua do DataTrack.
# Status: PREPARADO, AINDA NÃO PUBLICADO. Este workflow nunca rodou no GitHub Actions;
# os resultados citados em reports/ vêm de execução local (ver reports/metrics.md).
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      - run: ruff check . --output-format=github

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      DATATRACK_SECRET_KEY: ci-only-not-a-secret
      DATATRACK_SALT: ci-only-salt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes + cobertura (falha abaixo de 80%)
        run: >
          pytest --cov=src --cov-branch
          --cov-report=term-missing --cov-report=xml:coverage.xml
          --junitxml=junit.xml
      - name: Qualidade dos dados na amostra fixa (smoke)
        run: python -m src.validate --data data/sample_data.csv --json quality.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml
            quality.json
