[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datatrack"
version = "0.2.0"
description = "DataTrack · Radar de Absenteísmo — pipeline de ML, validação de qualidade de dados e painel web autenticado (Projeto Integrador CCD610)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Uso acadêmico" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.1", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["src*"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "smoke: teste ponta a ponta do pipeline com amostra fixa",
    "auth: testes de autenticação da aplicação web",
]

# ---------------------------------------------------------------- coverage (pytest-cov)
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "reports/coverage_html"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["reports", "instance"]

[tool.ruff.lint]
# E/W: estilo PEP 8 · F: erros (pyflakes) · I: imports · UP: sintaxe moderna
# B: bugs prováveis (bugbear) · SIM: simplificações · S: segurança (bandit)
select = ["E", "W", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# assert é o mecanismo do pytest; S105/S106 acusariam as senhas fictícias dos testes
"tests/**" = ["S101", "S105", "S106", "S311"]
# geração de dados sintéticos usa RNG não criptográfico de propósito
"src/data/ingest.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
